[project]
name = "document-sanity"
version = "0.2.2"
description = "Build PDF (LaTeX), interactive HTML, and Word (.docx) documents from a single Markdown source of truth — with variable substitution, figure management, and versioned builds."
# readme: dynamic, README.md with its relative links made absolute for PyPI
# (see [tool.hatch.metadata.hooks.fancy-pypi-readme] below).
dynamic = ["readme"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chase Yakaboski" }]
keywords = ["latex", "markdown", "word", "docx", "manuscripts", "provenance", "sanitism"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "coolname>=4.0.0",
    "pyyaml>=6.0",
    # Auto-cropping whitespace from raster figures during build. Soft-imported
    # in figure_crop.py so missing Pillow degrades to plain copy rather than
    # erroring out — but installing it is strongly recommended. Also used by
    # the Word output to size embedded images.
    "pillow>=10.0.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://sanitism.dev"
Documentation = "https://github.com/yakaboskic/document-sanity/tree/main/docs"
Repository = "https://github.com/yakaboskic/document-sanity"
Issues = "https://github.com/yakaboskic/document-sanity/issues"
Changelog = "https://github.com/yakaboskic/document-sanity/releases"
Demo = "https://document.sanitism.dev"

[project.scripts]
document-sanity = "document_sanity.cli:main"

[dependency-groups]
# Test-only tooling — not a runtime dependency. Install with `uv sync` (uv
# picks up dependency-groups by default) or `uv run --group dev pytest`.
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

# The PyPI page is the README, but pypi.org can't follow its relative links
# (docs/…, .github/…) or in-page anchors, so they're pointed at GitHub there.
# Other `](…)` in the README are code samples and stay as they are; so does
# the README in the repo.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#'
replacement = '](https://github.com/yakaboskic/document-sanity#'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?:\./)?((?:docs|\.github)(?:/[^)]*)?)\)'
replacement = '](https://github.com/yakaboskic/document-sanity/blob/main/\1)'

# Only what a source build needs (and its tests): nothing local or untracked
# from the working tree, like .claude/settings.local.json.
[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/src",
    "/skills",
    "/tests",
    "/docs",
    "/scripts",
    "/.claude-plugin",
    "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/document_sanity"]

# The agent skill lives at the repo root (where .claude-plugin/ finds it);
# `init` and `skills` copy it out of the installed package. The template
# snapshot (src/document_sanity/template/) is inside the package already.
[tool.hatch.build.targets.wheel.force-include]
"skills/document-sanity" = "document_sanity/skills/document-sanity"

[tool.pytest.ini_options]
testpaths = ["tests"]
